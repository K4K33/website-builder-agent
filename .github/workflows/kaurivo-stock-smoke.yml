name: Kaurivo stock smoke
# Verifies the free stock providers (Pixabay key secret, Openverse) without printing secrets or keeping images.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website-builder-agent/website-builder-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests pillow
      - name: Pixabay only, then Openverse only
        env:
          KAURIVO_PIXABAY_API_KEY: ${{ secrets.KAURIVO_PIXABAY_API_KEY }}
        run: |
          python - <<'PY'
          import os, tempfile
          from pathlib import Path
          import utils.stock_media as s
          print("pixabay key format ok:", bool(s.pixabay_key()))
          for name, chain in (("pixabay", (s._pixabay,)), ("openverse", (s._openverse,))):
              s.PROVIDERS = chain
              with tempfile.TemporaryDirectory() as tmp:
                  got = s.fetch_stock_photos("kylpyhuoneremontti laatoitus", Path(tmp), count=2)
                  print(name, len(got), [(g["provider"], g["licence"], Path(g["path"]).stat().st_size) for g in got])
                  if name == "pixabay" and not got:
                      raise SystemExit("Pixabay returned no usable photo")
          PY
      - name: Openverse raw probe
        run: |
          python - <<'PY'
          import requests
          for ua in (None, "Kaurivo/1.0 (+https://github.com/K4K33/website-builder-agent)"):
              for params in ({"q": "modern bathroom interior tiles", "license": "cc0,pdm,by", "aspect_ratio": "wide", "size": "large", "mature": "false", "page_size": 20},
                             {"q": "bathroom tiles", "license": "cc0,pdm,by", "page_size": 20}):
                  r = requests.get("https://api.openverse.org/v1/images/", params=params, timeout=20,
                                   headers={"User-Agent": ua} if ua else {})
                  print("ua", bool(ua), "status", r.status_code, r.headers.get("content-type"))
                  try:
                      j = r.json(); res = j.get("results") or []
                      print(" count", j.get("result_count"), [(x.get("license"), x.get("width"), x.get("height"), (x.get("url") or "")[:50]) for x in res[:6]])
                  except Exception as e:
                      print(" body", r.text[:200])
          PY
