name: Kaurivo stock smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OR_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ACCOUNT: ${{ secrets.KAURIVO_CLOUDFLARE_ACCOUNT_ID }}
      TOKEN: ${{ secrets.KAURIVO_CLOUDFLARE_API_TOKEN }}
      QA_MODEL: ${{ vars.KAURIVO_QA_MODEL_FREE || 'qwen/qwen3.8-27b:free' }}
    steps:
      - run: pip install -q requests pillow
      - name: QA model probe (status codes only)
        run: |
          python - <<'PY'
          import base64, io, json, os, requests
          from PIL import Image
          buf = io.BytesIO(); Image.new("RGB", (640, 400), (120, 140, 160)).save(buf, "PNG")
          img = "data:image/png;base64," + base64.b64encode(buf.getvalue()).decode()
          def short(r):
              try: return json.dumps(r.json())[:300]
              except Exception: return r.text[:300]
          m = "nvidia/nemotron-3.5-super-vl:free"
          r = requests.get("https://openrouter.ai/api/v1/models", timeout=30)
          ids = {x["id"] for x in r.json().get("data", [])}
          print("QA model listed:", m, m in ids)
          print("free vision-ish candidates:", sorted(i for i in ids if i.endswith(":free"))[:60])
          for label, content in (("text", "Reply OK"), ("vision", [{"type": "text", "text": "Describe colour"}, {"type": "image_url", "image_url": {"url": img}}])):
              r = requests.post("https://openrouter.ai/api/v1/chat/completions", timeout=90,
                  headers={"Authorization": "Bearer " + os.environ["OR_KEY"]},
                  json={"model": m, "messages": [{"role": "user", "content": content}], "max_tokens": 300})
              print("OR", label, r.status_code, short(r))
          r = requests.get("https://openrouter.ai/api/v1/key", timeout=30, headers={"Authorization": "Bearer " + os.environ["OR_KEY"]})
          d = r.json().get("data", {}); print("OR key usage:", {k: d.get(k) for k in ("usage", "limit", "is_free_tier", "rate_limit")})
          for m2 in ("google/gemma-4-26b-a4b-it:free", "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free", "baidu/ernie-5.5-flash-preview:free"):
              r = requests.post("https://openrouter.ai/api/v1/chat/completions", timeout=90,
                  headers={"Authorization": "Bearer " + os.environ["OR_KEY"]},
                  json={"model": m2, "messages": [{"role": "user", "content": [{"type": "text", "text": "What colour is this image? One word."}, {"type": "image_url", "image_url": {"url": img}}]}], "max_tokens": 300})
              print("OR2", m2, r.status_code, short(r))
          for cf in ():
              r = requests.post(f"https://api.cloudflare.com/client/v4/accounts/{os.environ['ACCOUNT']}/ai/run/{cf}", timeout=120,
                  headers={"Authorization": "Bearer " + os.environ["TOKEN"]},
                  json={"messages": [{"role": "user", "content": [{"type": "text", "text": "Describe colour"}, {"type": "image_url", "image_url": {"url": img}}]}], "max_tokens": 20})
              print("CF", cf, r.status_code, short(r))
          PY
