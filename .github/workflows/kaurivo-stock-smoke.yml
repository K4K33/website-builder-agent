name: Kaurivo stock smoke
# Verifies the free stock providers (Pixabay key secret, Openverse) without printing secrets or keeping images.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website-builder-agent/website-builder-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests pillow
      - name: Pixabay only, then Openverse only
        env:
          KAURIVO_PIXABAY_API_KEY: ${{ secrets.KAURIVO_PIXABAY_API_KEY }}
        run: |
          python - <<'PY'
          import os, tempfile
          from pathlib import Path
          import utils.stock_media as s
          print("pixabay key format ok:", bool(s.pixabay_key()))
          for name, chain in (("pixabay", (s._pixabay,)), ("openverse", (s._openverse,))):
              s.PROVIDERS = chain
              with tempfile.TemporaryDirectory() as tmp:
                  got = s.fetch_stock_photos("kylpyhuoneremontti laatoitus", Path(tmp), count=2)
                  print(name, len(got), [(g["provider"], g["licence"], Path(g["path"]).stat().st_size) for g in got])
                  if not got:
                      raise SystemExit(name + " returned no usable photo")
          PY
      - name: Openverse candidate diagnosis
        if: always()
        run: |
          python - <<'PY'
          import requests, utils.stock_media as s
          for q in s.queries_for("kylpyhuoneremontti"):
              c = list(s._openverse(requests, q))
              print(q, len(c))
              for p in c[:8]:
                  ok = s._allowed_url(p)
                  st = ""
                  if s._usable(p) and ok:
                      r = requests.get(p["url"], timeout=20); st = (r.status_code, r.headers.get("content-type"))
                  print("  ", p["width"], p["height"], s._usable(p), ok, st, p["url"][:60])
          PY
