name: Kaurivo Karjalanneito source and live browser QA

on:
  pull_request:
    paths:
      - "website-builder-agent/website-builder-agent/docs/kaurivo/demos/kukkakauppa-karjalanneito-v1/**"
      - "website-builder-agent/website-builder-agent/tests/test_karjalanneito_demo.py"
      - "website-builder-agent/website-builder-agent/tests/browser_karjalanneito_preview.py"
      - ".github/workflows/kaurivo-karjalanneito-demo-qa.yml"
  workflow_run:
    workflows: ["Deploy static content to Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-content-and-functional-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: website-builder-agent/website-builder-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install free parser
        run: python -m pip install beautifulsoup4
      - name: Three routes, source photo parity, dimensions and facts
        run: python -m unittest tests.test_karjalanneito_demo -v

  local-browser:
    if: github.event_name == 'pull_request'
    needs: original-content-and-functional-contract
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: website-builder-agent/website-builder-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify local PR build, image loading, gallery filters and 12 viewports
        run: python -m tests.browser_karjalanneito_preview --local
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: karjalanneito-pr-local-screenshots
          path: website-builder-agent/website-builder-agent/qa-evidence/karjalanneito-local/
          if-no-files-found: ignore

  live-browser:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: website-builder-agent/website-builder-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify public published image loading, gallery and 12 viewports
        run: python -m tests.browser_karjalanneito_preview --live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: karjalanneito-live-screenshots
          path: website-builder-agent/website-builder-agent/qa-evidence/karjalanneito-live/
          if-no-files-found: ignore
