name: Website Builder Agent

on:
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest

    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: website-builder-agent/website-builder-agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scout
        working-directory: website-builder-agent/website-builder-agent
        run: python main.py scout --count 3 --industry "kampaamo" --location "Tampere"
