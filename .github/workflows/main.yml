name: Website Builder Agent

on:
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: website-builder-agent/website-builder-agent
        run: pip install -r requirements.txt

      - name: Run agent
        working-directory: website-builder-agent/website-builder-agent
        run: python main.py
