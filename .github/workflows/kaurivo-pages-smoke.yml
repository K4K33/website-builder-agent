name: Kaurivo live Pages smoke check

on:
  workflow_run:
    workflows: ["Deploy static content to Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kaurivo-pages-smoke
  cancel-in-progress: true

jobs:
  live:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify deployed admin and PWA files via public URLs
        shell: bash
        run: |
          set -euo pipefail
          base="https://k4k33.github.io/website-builder-agent/kaurivo/admin/"
          for file in "" "manifest.webmanifest" "sw.js"; do
            url="${base}${file}"
            echo "Checking ${url}"
            ok="false"
            for attempt in 1 2 3 4 5 6; do
              code=$(curl --max-time 12 -sSL -o /tmp/kaurivo-live-check -w '%{http_code}' "${url}" || true)
              echo "Attempt ${attempt}: HTTP ${code}"
              if [[ "${code}" == "200" ]]; then
                if [[ -z "${file}" ]]; then
                  if grep -q 'Aamun yrityslista' /tmp/kaurivo-live-check; then ok="true"; break; fi
                elif [[ "${file}" == "sw.js" ]]; then
                  if grep -q 'notificationclick' /tmp/kaurivo-live-check; then ok="true"; break; fi
                elif grep -q 'Kaurivo' /tmp/kaurivo-live-check; then ok="true"; break; fi
              fi
              sleep 8
            done
            if [[ "${ok}" != "true" ]]; then
              echo "::error::Live Kaurivo admin/PWA URL is unavailable or serves stale content: ${url}"
              exit 1
            fi
          done
          echo "Live Kaurivo admin and PWA files are accessible." >> "$GITHUB_STEP_SUMMARY"
