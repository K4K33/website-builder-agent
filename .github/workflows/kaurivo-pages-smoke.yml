name: Kaurivo live Pages smoke check

on:
  workflow_run:
    workflows: ["Deploy static content to Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kaurivo-pages-smoke
  cancel-in-progress: true

jobs:
  live:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify deployed admin and PWA files via public URLs
        shell: bash
        run: |
          set -euo pipefail
          base="https://k4k33.github.io/website-builder-agent/kaurivo/admin/"
          for file in "" "manifest.webmanifest" "sw.js" "../assets/crm.css?v=20261031-mobile2" "../assets/crm.js?v=20261031-mobile2"; do
            url="${base}${file}"
            echo "Checking ${url}"
            ok="false"
            for attempt in 1 2 3 4 5 6; do
              code=$(curl --max-time 12 -sSL -o /tmp/kaurivo-live-check -w '%{http_code}' "${url}" || true)
              echo "Attempt ${attempt}: HTTP ${code}"
              if [[ "${code}" == "200" ]]; then
                if [[ -z "${file}" ]]; then
                  if grep -q 'id="mobile-dock"' /tmp/kaurivo-live-check && grep -q 'id="prospect-list"' /tmp/kaurivo-live-check; then ok="true"; break; fi
                elif [[ "${file}" == "sw.js" ]]; then
                  if grep -q 'notificationclick' /tmp/kaurivo-live-check; then ok="true"; break; fi
                elif [[ "${file}" == *"crm.css"* ]]; then
                  if grep -q '.mobile-dock' /tmp/kaurivo-live-check; then ok="true"; break; fi
                elif [[ "${file}" == *"crm.js"* ]]; then
                  if grep -q 'navigateMobile' /tmp/kaurivo-live-check; then ok="true"; break; fi
                elif grep -q 'Kaurivo' /tmp/kaurivo-live-check; then ok="true"; break; fi
              fi
              sleep 8
            done
            if [[ "${ok}" != "true" ]]; then
              echo "::error::Live Kaurivo admin/PWA URL is unavailable or serves stale content: ${url}"
              exit 1
            fi
          done
          echo "Live Kaurivo admin and PWA files are accessible." >> "$GITHUB_STEP_SUMMARY"
          preview="https://k4k33.github.io/website-builder-agent/kaurivo/demos/kotifixi-v7/"
          for target in "" "palvelut/" "hinnasto/" "meista/" "yhteys/" "assets/style.css" "assets/app.js"; do
            url="${preview}${target}"
            echo "Checking Kotifixi V7 deployed URL: ${url}"
            ok="false"
            for attempt in 1 2 3 4 5 6; do
              code=$(curl --max-time 15 -sSL -o /tmp/kotifixi-v7-live -w '%{http_code}' "${url}" || true)
              echo "Attempt ${attempt}: HTTP ${code}"
              if [[ "${code}" == "200" ]]; then
                case "${target}" in
                  "") marker='class="hero-actions"' ;;
                  "palvelut/") marker='class="service-row"' ;;
                  "hinnasto/") marker='pricing-grid' ;;
                  "meista/") marker='class="about-photo"' ;;
                  "yhteys/") marker='id="contact-form"' ;;
                  "assets/style.css") marker='--container:1240px' ;;
                  "assets/app.js") marker='kaurivo-kotifixi-demo-contact' ;;
                esac
                if grep -Fq -- "${marker}" /tmp/kotifixi-v7-live; then
                  ok="true"
                  break
                fi
              fi
              sleep 5
            done
            if [[ "${ok}" != "true" ]]; then
              echo "::error::Kotifixi V7 URL missing, stale or inaccessible: ${url}"
              exit 1
            fi
          done
          echo "Kotifixi V7 home, subpages, CSS and contact JS are live." >> "$GITHUB_STEP_SUMMARY"


          # All current three-industry V4 owner previews: exact public URL + version marker + subpage.
          for demo in te-service-v4 ravintola-rosanne-v4 rakennuspalvelu-rili-v4; do
            case "${demo}" in
              te-service-v4) marker='Autohuolto ja korjaukset Kirkkonummella.'; sub='huollot/' ;;
              ravintola-rosanne-v4) marker='suunnitteludemon esimerkkisisältöä'; sub='juhlat/' ;;
              rakennuspalvelu-rili-v4) marker='Rakennamme ja remontoimme Etelä-Savossa.'; sub='kohteet/' ;;
            esac
            url="https://k4k33.github.io/website-builder-agent/kaurivo/demos/${demo}/"
            code=$(curl --max-time 15 -sSL -o /tmp/kaurivo-v4-live -w '%{http_code}' "${url}" || true)
            if [[ "${code}" != "200" ]] || ! grep -Fq -- "${marker}" /tmp/kaurivo-v4-live; then
              echo "::error::V4 preview missing or stale: ${url} (HTTP ${code})"
              exit 1
            fi
            suburl="${url}${sub}"
            code=$(curl --max-time 15 -sSL -o /tmp/kaurivo-v4-sub -w '%{http_code}' "${suburl}" || true)
            if [[ "${code}" != "200" ]] || ! grep -Fq 'name="robots"' /tmp/kaurivo-v4-sub; then
              echo "::error::V4 subpage missing: ${suburl} (HTTP ${code})"
              exit 1
            fi
            echo "Verified V4 demo live: ${url} and ${suburl}" >> "$GITHUB_STEP_SUMMARY"
          done

          # New unseen-company first-pass dog salon: all 7 real routes and assets.
          new_demo="https://k4k33.github.io/website-builder-agent/kaurivo/demos/helsingin-koiratrimmaamo-v1/"
          for entry in             "|Turkinhoitoa"             "palvelut/|Turkin nyppiminen"             "hinnasto/|93–120 €"             "trimmaajat/|Eveliina Tissari"             "tarina/|Anja Luoso"             "sijainti/|Viipurinkatu 18"             "ajanvaraus/|www.varaaheti.fi/helsinginkoiratrimmaamo/fi"             "assets/style.css|--forest:#20362d"             "assets/app.js|data-menu-toggle"; do
            path="${entry%%|*}"
            marker="${entry#*|}"
            url="${new_demo}${path}"
            ok="false"
            for attempt in 1 2 3 4 5; do
              code=$(curl --max-time 15 -sSL -o /tmp/kaurivo-new-trimmer-live -w '%{http_code}' "${url}" || true)
              echo "Live ${path:-home} attempt ${attempt}: HTTP ${code}"
              if [[ "${code}" == "200" ]] && grep -Fq -- "${marker}" /tmp/kaurivo-new-trimmer-live; then
                ok="true"; break
              fi
              sleep 7
            done
            if [[ "${ok}" != "true" ]]; then
              echo "::error::New 7-page dog salon unavailable or stale: ${url}"
              exit 1
            fi
            echo "Public dog salon preview verified: ${url}" >> "$GITHUB_STEP_SUMMARY"
          done

          # New unrelated company demo: exact live page routes and static assets.
          shoe_demo="https://k4k33.github.io/website-builder-agent/kaurivo/demos/jakomaen-suutari-ja-pyora-v1/"
          for entry in             "|Kengät."             "suutari-hinnasto/|Abloy avain"             "pyorahuolto-hinnasto/|Jarrulänkiparin asennus"             "yhteystiedot/|Huokotie 1"             "assets/site.css|--burnt:#b4522e"             "assets/site.js|priceSearch"; do
            file="${entry%%|*}"
            marker="${entry#*|}"
            url="${shoe_demo}${file}"
            ok="false"
            for attempt in 1 2 3 4 5 6; do
              code=$(curl --max-time 15 -sSL -o /tmp/jakomaen-live -w '%{http_code}' "${url}" || true)
              if [[ "${code}" == "200" ]] && grep -Fq -- "${marker}" /tmp/jakomaen-live; then
                ok="true"; break
              fi
              sleep 7
            done
            if [[ "${ok}" != "true" ]]; then
              echo "::error::Jakomäki demo missing, stale or inaccessible: ${url}"
              exit 1
            fi
            echo "Verified live Jakomäki demo: ${url}" >> "$GITHUB_STEP_SUMMARY"
          done
