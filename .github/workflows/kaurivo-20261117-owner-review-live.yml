name: Kaurivo block publicly accessible unfinished 17 Nov owner-review demos
on:
  workflow_run:
    workflows: ["Deploy static content to Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kaurivo-20261117-owner-review-unpublished
  cancel-in-progress: true

jobs:
  ensure-unpublished:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Verify staged draft source is not in publicly deployed docs
        run: |
          test ! -e website-builder-agent/website-builder-agent/docs/kaurivo/owner-review
      - name: Verify all 3 incomplete demo links are not publicly available
        shell: bash
        run: |
          set -euo pipefail
          base="https://k4k33.github.io/website-builder-agent/kaurivo/owner-review/2026-11-17"
          for slug in ostroferia-kurkela settimedia talousfocus; do
            url="$base/$slug/"
            blocked=false
            # Pages/CDN may settle after the GitHub deployment job completes.
            for attempt in 1 2 3 4 5 6; do
              code="$(curl -sS -L --max-time 15 -o /dev/null -w '%{http_code}' "$url" || true)"
              if [[ "$code" == 404 || "$code" == 410 ]]; then
                blocked=true
                break
              fi
              sleep 6
            done
            if [[ "$blocked" != true ]]; then
              echo "::error::Unapproved demo is still publicly accessible or status not verifiable: $url"
              exit 1
            fi
          done
          echo "All three unfinished owner-review previews are unpublished; no owner demo links permitted." >> "$GITHUB_STEP_SUMMARY"
