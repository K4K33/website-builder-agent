name: Kaurivo international V7 full-scroll reference audit
on:
  workflow_dispatch:
    inputs:
      count:
        description: "Number of industry candidates (1-15); ignored for awarded QA trio"
        type: number
        default: 15
        required: false
      mode:
        description: "Global awarded QA trio, or sector inspiration library"
        type: choice
        options: [global, sector]
        default: global
  push:
    branches: [main]
    paths:
      - "website-builder-agent/website-builder-agent/utils/reference_scroll_experience.py"
      - "website-builder-agent/website-builder-agent/scripts/audit_v7_reference_scroll.py"
      - "website-builder-agent/website-builder-agent/config/kaurivo_v7_reference_candidates.json"
permissions:
  contents: read
jobs:
  live-scroll-study:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: website-builder-agent/website-builder-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real Chromium and evidence tools
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Scroll real global award experiences or sector candidates
        run: |
          if [ "$MODE" = "global" ]; then
            python -m scripts.audit_v7_reference_scroll --global-craft
          else
            python -m scripts.audit_v7_reference_scroll --count "$COUNT"
          fi
        env:
          COUNT: ${{ github.event.inputs.count || '15' }}
          MODE: ${{ github.event.inputs.mode || 'global' }}
      - name: Retain audit metadata even for inaccessible references
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaurivo-v7-real-scroll-metadata-${{ github.run_id }}
          path: |
            website-builder-agent/website-builder-agent/output/v7-reference-scroll-audit/report.json
            website-builder-agent/website-builder-agent/output/screenshots/global-v7-*.png
            website-builder-agent/website-builder-agent/output/screenshots/global-v7-*.jpg
            website-builder-agent/website-builder-agent/output/screenshots/global-v7-*-scroll-videos/**/*.webm
          if-no-files-found: warn
          retention-days: 7
