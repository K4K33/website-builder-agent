name: Kaurivo fast visual media integrity

on:
  pull_request:
    paths:
      - "website-builder-agent/website-builder-agent/utils/visual_media_gate.py"
      - "website-builder-agent/website-builder-agent/utils/local_media_intake.py"
      - "website-builder-agent/website-builder-agent/agents/qa.py"
      - "website-builder-agent/website-builder-agent/agents/builder.py"
      - "website-builder-agent/website-builder-agent/config.py"
      - "website-builder-agent/website-builder-agent/tests/test_visual_media_gate.py"
      - "website-builder-agent/website-builder-agent/tests/test_local_media_intake.py"
      - ".github/workflows/kaurivo-visual-media-fast.yml"
  push:
    branches: [main]
    paths:
      - "website-builder-agent/website-builder-agent/utils/visual_media_gate.py"
      - "website-builder-agent/website-builder-agent/utils/local_media_intake.py"
      - "website-builder-agent/website-builder-agent/agents/qa.py"
      - "website-builder-agent/website-builder-agent/agents/builder.py"
      - "website-builder-agent/website-builder-agent/config.py"
      - "website-builder-agent/website-builder-agent/tests/test_visual_media_gate.py"
      - "website-builder-agent/website-builder-agent/tests/test_local_media_intake.py"
      - ".github/workflows/kaurivo-visual-media-fast.yml"

permissions:
  contents: read

jobs:
  media-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: website-builder-agent/website-builder-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python imports only (no browser / paid API)
        run: python -m pip install -r requirements.txt
      - name: Compile shared Builder and QA modules
        run: python -m py_compile agents/builder.py agents/qa.py config.py utils/visual_media_gate.py utils/local_media_intake.py
      - name: Generic media and logo regression tests
        run: python -m unittest discover -s tests -p "test_visual_media_gate.py" -v
      - name: Safe client photo intake regression tests
        run: python -m unittest discover -s tests -p "test_local_media_intake.py" -v
