name: Kaurivo national business discovery (PRH bulk)

on:
  schedule:
    # Europe/Helsinki local clock, DST-aware. Off the hour.
    - cron: "13 4 * * *"
      timezone: "Europe/Helsinki"
    # Recovery only when no successful 04:13 run exists for this Finnish day.
    - cron: "17 6 * * *"
      timezone: "Europe/Helsinki"
  workflow_dispatch:
    inputs:
      mode:
        description: "offline = test pipeline; pilot-live = one national PRH ZIP GET"
        type: choice
        required: true
        default: offline
        options:
          - offline
          - pilot-live

permissions:
  contents: read
  actions: read
  id-token: write  # Short-lived GitHub OIDC assertion to Kaurivo only; no static keys.

concurrency:
  group: kaurivo-national-prh
  cancel-in-progress: false

jobs:
  national:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website-builder-agent/website-builder-agent
    env:
      OPENROUTER_API_KEY: ""
      TAVILY_API_KEY: ""
      FREE_ONLY: "1"
      PYTHONUNBUFFERED: "1"
      KAURIVO_PRH_MODE: ${{ github.event_name == 'schedule' && 'pilot-live' || inputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Decide whether the 06:17 recovery is required
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: python -m utils.kaurivo_backup_gate

      - name: Restore previously considered business IDs (best effort)
        if: ${{ steps.gate.outputs.should_scan == 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: website-builder-agent/website-builder-agent/data/prh_seen_ids.json
          key: prh-company-history-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            prh-company-history-v1-

      - name: Install requirements
        if: ${{ steps.gate.outputs.should_scan == 'true' }}
        run: pip install -r requirements.txt

      - name: National PRH ZIP, one request at most; process all records locally
        if: ${{ steps.gate.outputs.should_scan == 'true' }}
        run: |
          python -m utils.prh_bulk_discovery \
            --mode "$KAURIVO_PRH_MODE" \
            --max-candidates 5000 \
            --shortlist-size 50 \
            --output-dir output/nightly-prh \
            --seen-path data/prh_seen_ids.json

      - name: Find candidate websites through an optional bounded official search API
        if: ${{ success() && github.event_name == 'schedule' && steps.gate.outputs.should_scan == 'true' && env.KAURIVO_PRH_MODE == 'pilot-live' }}
        env:
          KAURIVO_TAVILY_API_KEY: ${{ secrets.KAURIVO_TAVILY_API_KEY }}
        run: |
          # If no free-tier key is configured, this is a zero-request no-op.
          # Maximum 12 basic searches per run; results are unverified suggestions.
          python -m utils.kaurivo_website_research \
            --packet output/nightly-prh/crm-shortlist.json \
            --max-queries 12

      - name: Sync 50 unverified PRH company records into private Kaurivo CRM
        if: ${{ success() && steps.gate.outputs.should_scan == 'true' && env.KAURIVO_PRH_MODE == 'pilot-live' }}
        run: |
          python -m utils.prh_crm_sync \
            --packet output/nightly-prh/crm-shortlist.json

      - name: Show fresh lead report for manual review
        if: ${{ success() && steps.gate.outputs.should_scan == 'true' }}
        run: |
          cat output/nightly-prh/shortlist.md >> "$GITHUB_STEP_SUMMARY"
          echo "Kaurivo CRM: validated public PRH candidates are sent only to the private UNVERIFIED lead queue using GitHub OIDC; no static credentials." >> "$GITHUB_STEP_SUMMARY"
          echo "No AI credits, automatic demo claims or marketing sends." >> "$GITHUB_STEP_SUMMARY"

      - name: Explain source failure without inventing search results
        if: ${{ failure() && steps.gate.outputs.should_scan == 'true' }}
        run: |
          echo "## National PRH discovery failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Check logs. A failed download must not be treated as zero available leads." >> "$GITHUB_STEP_SUMMARY"

      - name: Record failed scheduled PRH run to private admin health
        if: ${{ failure() && github.event_name == 'schedule' }}
        run: python -m utils.kaurivo_report_failure

      - name: Record failed live PRH run in private admin operations
        if: ${{ failure() && steps.gate.outputs.should_scan == 'true' && env.KAURIVO_PRH_MODE == 'pilot-live' }}
        continue-on-error: true
        run: python -m utils.kaurivo_failure_report

      - name: Retain national discovery report for 14 days
        if: ${{ always() && steps.gate.outputs.should_scan == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: kaurivo-national-leads-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            website-builder-agent/website-builder-agent/output/nightly-prh/
            website-builder-agent/website-builder-agent/data/prh_seen_ids.json

      - name: Cache only a successful history update
        if: ${{ success() && steps.gate.outputs.should_scan == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: website-builder-agent/website-builder-agent/data/prh_seen_ids.json
          key: prh-company-history-v1-${{ github.run_id }}-${{ github.run_attempt }}
