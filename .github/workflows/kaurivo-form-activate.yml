name: Kaurivo FormSubmit one-time activation test
on:
  push:
    paths:
      - .github/workflows/kaurivo-form-activate.yml
permissions:
  contents: read
jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send single synthetic form test
        shell: bash
        run: |
          set -eu
          HTTP_CODE=$(curl --silent --show-error --max-time 18 \
            --output /tmp/response-body --dump-header /tmp/response-headers \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Origin: https://k4k33.github.io' \
            --header 'Referer: https://k4k33.github.io/website-builder-agent/kaurivo/feedback/' \
            --header 'Accept: application/json' \
            --data-urlencode 'company=Kaurivo synthetic activation test' \
            --data-urlencode 'email=hello.kaurivo@gmail.com' \
            --data-urlencode 'feedback_stage=internal_activation_test' \
            --data-urlencode 'rating=5' \
            --data-urlencode 'message=Internal activation test, no real customer' \
            --data-urlencode '_subject=KAURIVO - ACTIVATE FORM (TEST)' \
            'https://formsubmit.co/ajax/hello.kaurivo@gmail.com')
          echo "HTTP status: $HTTP_CODE"
          grep -i '^content-type:' /tmp/response-headers || true
          python - <<'PY'
          import json
          from pathlib import Path
          body=Path('/tmp/response-body').read_text()
          try:
              result=json.loads(body)
              print("JSON provider response:",result.get("success"),str(result.get("message",""))[:160])
          except (ValueError,TypeError):
              # No raw HTML, customer data, or secrets are printed.
              print("Provider response was not JSON; first non-empty line tag:",body.strip().splitlines()[0][:100] if body.strip() else "EMPTY")
          PY
