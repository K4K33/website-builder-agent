name: Kaurivo build film
# One trade's construction film, end to end, free and without company data:
# 1) interior keyframes of one room in its stages (Workers Free / Gemini free),
# 2) quality gate (same room and camera + strict free vision review),
# 3) only if it passes: the open Wan 2.2 first-last-frame model animates each
#    pair (free Hugging Face ZeroGPU), clips are joined and cut into frames.
# Results are encrypted to the recipient and printed (never stored in plain form).
on:
  workflow_dispatch:
    inputs:
      trade:
        description: Trade (kylpyhuone)
        default: kylpyhuone
      recipient:
        description: Base64 PEM public key for the encrypted result
        required: true
      limit:
        description: Number of clips (0 = all)
        default: "0"
      keys:
        description: "generate = new keyframes, repo = committed keyframes"
        default: generate
      provider:
        description: "Image provider for keyframes: auto (Workers Free first) or gemini"
        default: auto
permissions:
  contents: read
jobs:
  film:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: website-builder-agent/website-builder-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q -r requirements.txt "gradio_client>=1.3" && (command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null))
      - name: Keyframes, quality gate, film
        env:
          FREE_ONLY: "1"
          KAURIVO_HF_TOKEN: ${{ secrets.KAURIVO_HF_TOKEN }}
          KAURIVO_CLOUDFLARE_WORKERS_FREE_CONFIRMED: ${{ vars.KAURIVO_CLOUDFLARE_WORKERS_FREE_CONFIRMED || '0' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.KAURIVO_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.KAURIVO_CLOUDFLARE_API_TOKEN }}
          KAURIVO_GEMINI_API_KEY: ${{ secrets.KAURIVO_GEMINI_API_KEY }}
          KAURIVO_GEMINI_FREE_CONFIRMED: ${{ vars.KAURIVO_GEMINI_FREE_CONFIRMED || '1' }}
          KAURIVO_ILLUSTRATED_SEQUENCE: "1"
          AI_BACKEND: openrouter
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: openrouter/free
          QA_MODEL: ${{ vars.KAURIVO_QA_MODEL_FREE_V2 || 'nvidia/nemotron-3.5-super-vl:free' }}
          QA_FALLBACK_MODELS: ${{ vars.KAURIVO_QA_FALLBACK_MODELS_FREE || 'nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free' }}
          TRADE: ${{ inputs.trade }}
          LIMIT: ${{ inputs.limit }}
          KEYS: ${{ inputs.keys }}
          KAURIVO_SEQUENCE_PROVIDER: ${{ inputs.provider }}
          ATTEMPTS: "3"
        run: |
          python - <<'PY'
          import json, os, shutil, time
          from pathlib import Path
          from utils import build_film, illustrated_sequence, sequence_qa
          trade, out = os.environ["TRADE"], Path("film-out")
          root = Path("film-work")
          keys = root / trade / "keys"
          keys.mkdir(parents=True, exist_ok=True)
          out.mkdir(exist_ok=True)
          best = None
          if os.environ.get("KEYS", "generate") == "generate":
              # Up to 3 attempts (different seeds); keep the best, stop at the first pass.
              for attempt in range(int(os.environ.get("ATTEMPTS") or 3)):
                  os.environ["KAURIVO_SEQUENCE_SEED_OFFSET"] = str(attempt * 17)
                  topic = {"talo": "omakotitalon rakentaminen", "maalaus": "maalaustyöt"}.get(trade, trade + "remontti")
                  seq = illustrated_sequence.generate_sequence(topic, root / f"seq{attempt}")
                  print("keyframes attempt", attempt + 1, bool(seq), illustrated_sequence.LAST_ERROR)
                  if not seq:
                      break
                  qa = sequence_qa.check([Path(p) for p in seq["paths"]], seq["labels"], ref=seq.get("base"),
                                         trade=seq.get("trade", ""))
                  print("quality gate:", json.dumps(qa, ensure_ascii=False))
                  if best is None or (qa["ok"], qa["score"]) > (best[1]["ok"], best[1]["score"]):
                      best = (seq["paths"], qa, attempt)
                  if qa["ok"]:
                      break
              if best is None:
                  raise SystemExit("no keyframes")
              paths, qa = best[0], best[1]
              for a in range(3):
                  for p in sorted((root / f"seq{a}").glob("*.webp")):
                      shutil.copyfile(p, out / f"try{a + 1}-{p.name}")
          else:
              paths = build_film.keyframes(trade, Path("assets/sales_demo/film"))
              qa = sequence_qa.check(paths, [f"k{i + 1}" for i in range(len(paths))])
          for i, p in enumerate(paths):
              shutil.copyfile(p, keys / f"k{i + 1}{Path(p).suffix}")
              shutil.copyfile(p, out / f"key-{i + 1}{Path(p).suffix}")
          print("chosen:", json.dumps(qa, ensure_ascii=False))
          (out / "qa.json").write_text(json.dumps(qa, ensure_ascii=False))
          if not qa["ok"]:
              print("Rejected by the quality gate: no film is made from these keyframes.")
              raise SystemExit(0)
          start = time.monotonic()
          got = build_film.make_film(trade, root, out, limit=int(os.environ.get("LIMIT") or 0))
          print("film:", json.dumps(got, default=str)[:1500], "%.0fs" % (time.monotonic() - start))
          PY
      - name: Encrypt for the recipient
        if: always()
        env:
          RECIPIENT: ${{ inputs.recipient }}
        run: |
          test -d film-out || exit 0
          echo "$RECIPIENT" | base64 -d > /tmp/pub.pem
          tar -C film-out -czf /tmp/s.tgz .
          openssl rand -hex 32 > /tmp/k
          openssl enc -aes-256-cbc -pbkdf2 -salt -in /tmp/s.tgz -out /tmp/s.enc -pass file:/tmp/k
          openssl pkeyutl -encrypt -pubin -inkey /tmp/pub.pem -pkeyopt rsa_padding_mode:oaep -in /tmp/k -out /tmp/k.enc
          echo "KEY:$(base64 -w0 /tmp/k.enc)"
          base64 -w 4000 /tmp/s.enc | sed 's/^/DAT:/'
          rm -f /tmp/k /tmp/s.tgz
