name: Kaurivo private feedback triage

on:
  schedule:
    # FormSubmit free API: max five calls per day; we use four.
    - cron: '5 0,6,12,18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kaurivo-private-feedback
  cancel-in-progress: false

jobs:
  digest:
    # An unactivated monitor costs zero runner minutes or API requests.
    if: ${{ vars.KAURIVO_FEEDBACK_ENABLED == 'true' }}
    name: Anonymous feedback classification
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check activated archive
        working-directory: website-builder-agent/website-builder-agent
        env:
          KAURIVO_FORMSUBMIT_API_KEY: ${{ secrets.KAURIVO_FORMSUBMIT_API_KEY }}
        run: |
          python -m utils.process_kaurivo_feedback
