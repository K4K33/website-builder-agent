name: Kaurivo Penny Lane source-faithful visual browser QA
on:
  push:
    branches: ["feat/pennylane-vintage-20261104"]
    paths:
      - "website-builder-agent/website-builder-agent/docs/kaurivo/demos/penny-lane-vintage-v1/**"
      - "website-builder-agent/website-builder-agent/tests/browser_pennylane_demo.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshot-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: website-builder-agent/website-builder-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - run: python tests/browser_pennylane_demo.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pennylane-new-browser-evidence
          path: website-builder-agent/website-builder-agent/qa-evidence/pennylane/new/
          if-no-files-found: warn
          retention-days: 30
