name: Kaurivo universal objective QA on every changed demo

on:
  pull_request:
    paths:
      - "website-builder-agent/website-builder-agent/docs/kaurivo/demos/**"
      - "website-builder-agent/website-builder-agent/utils/source_experience.py"
      - "website-builder-agent/website-builder-agent/utils/source_signature_lock.py"
      - "website-builder-agent/website-builder-agent/utils/route_experience_contract.py"
      - "website-builder-agent/website-builder-agent/utils/cross_route_editorial_risks.py"
      - "website-builder-agent/website-builder-agent/utils/site_architecture.py"
      - "website-builder-agent/website-builder-agent/utils/site_build_pipeline.py"
      - "website-builder-agent/website-builder-agent/utils/browser_qa.py"
      - "website-builder-agent/website-builder-agent/tests/test_route_experience_contract.py"
      - "website-builder-agent/website-builder-agent/tests/test_route_firstfold_browser.py"
      - "website-builder-agent/website-builder-agent/data/demo_provenance/**"
      - "website-builder-agent/website-builder-agent/tests/test_source_signature_lock.py"
      - "website-builder-agent/website-builder-agent/utils/universal_quality.py"
      - "website-builder-agent/website-builder-agent/utils/source_identity.py"
      - "website-builder-agent/website-builder-agent/utils/brand_design_blueprint.py"
      - "website-builder-agent/website-builder-agent/tests/test_source_experience.py"
      - "website-builder-agent/website-builder-agent/scripts/audit_changed_demo_previews.py"
      - ".github/workflows/kaurivo-all-new-demos-universal-qa.yml"
  push:
    branches: [main]
    paths:
      - "website-builder-agent/website-builder-agent/docs/kaurivo/demos/**"
      - "website-builder-agent/website-builder-agent/utils/source_experience.py"
      - "website-builder-agent/website-builder-agent/utils/source_signature_lock.py"
      - "website-builder-agent/website-builder-agent/utils/route_experience_contract.py"
      - "website-builder-agent/website-builder-agent/utils/cross_route_editorial_risks.py"
      - "website-builder-agent/website-builder-agent/utils/site_architecture.py"
      - "website-builder-agent/website-builder-agent/utils/site_build_pipeline.py"
      - "website-builder-agent/website-builder-agent/utils/browser_qa.py"
      - "website-builder-agent/website-builder-agent/tests/test_route_experience_contract.py"
      - "website-builder-agent/website-builder-agent/tests/test_route_firstfold_browser.py"
      - "website-builder-agent/website-builder-agent/data/demo_provenance/**"
      - ".github/workflows/kaurivo-all-new-demos-universal-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  objective-demo-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: website-builder-agent/website-builder-agent
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install free offline parser
        run: python -m pip install beautifulsoup4
      - name: Compile sources
        run: python -m py_compile utils/source_experience.py utils/source_identity.py utils/source_signature_lock.py utils/route_experience_contract.py utils/cross_route_editorial_risks.py utils/brand_design_blueprint.py utils/universal_quality.py scripts/audit_changed_demo_previews.py
      - name: Test source-based motion/media fidelity
        run: python -m unittest tests.test_source_experience tests.test_source_signature_lock tests.test_brand_lock -v
      - name: Block changed hand-authored demos that bypass universal QA
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/audit_changed_demo_previews.py
