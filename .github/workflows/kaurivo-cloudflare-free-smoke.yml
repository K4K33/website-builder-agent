name: Kaurivo Workers Free actual model smoke test
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kaurivo-cloudflare-free-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  free-smoke:
    if: github.repository == 'K4K33/website-builder-agent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FREE_CONFIRMED: ${{ vars.KAURIVO_CLOUDFLARE_WORKERS_FREE_CONFIRMED || '0' }}
      ACCOUNT: ${{ secrets.KAURIVO_CLOUDFLARE_ACCOUNT_ID }}
      TOKEN: ${{ secrets.KAURIVO_CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Verify actual free-only Cloudflare Gemma model
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, urllib.request, urllib.error
          if os.environ.get("FREE_CONFIRMED") != "1":
              raise SystemExit("STOP: Workers Free not explicitly confirmed.")
          account=os.environ.get("ACCOUNT","").strip()
          token=os.environ.get("TOKEN","").strip()
          if not re.fullmatch(r"[a-f0-9]{32}",account) or not re.fullmatch(r"[A-Za-z0-9_-]{25,250}",token):
              raise SystemExit("STOP: required Workers Free credentials missing or invalid.")
          # Exactly one small inference on a model Cloudflare lists on Workers Free.
          # Never print the account ID, token, response text, or request metadata.
          model="@cf/google/gemma-4-26b-a4b-it"
          payload={"model":model, "stream":False, "max_tokens":180,
              "messages":[
                  {"role":"system","content":"Respond with one English word, READY."},
                  {"role":"user","content":"State READY."}]}
          url="https://api.cloudflare.com/client/v4/accounts/"+account+"/ai/v1/chat/completions"
          req=urllib.request.Request(url,data=json.dumps(payload).encode("utf-8"),
              method="POST",headers={"Authorization":"Bearer "+token,
                                     "Content-Type":"application/json"})
          try:
              with urllib.request.urlopen(req,timeout=125) as res:
                  status=res.status
                  response=json.load(res)
          except urllib.error.HTTPError as exc:
              raise SystemExit("Cloudflare Free model HTTP "+str(exc.code)) from None
          except Exception as exc:
              raise SystemExit("Cloudflare Free connectivity failed: "+type(exc).__name__) from None
          if status != 200 or not isinstance(response,dict):
              raise SystemExit("Cloudflare model response invalid")
          if response.get("model") not in (None,model):
              raise SystemExit("Cloudflare returned an unapproved model")
          choices=response.get("choices")
          if not isinstance(choices,list) or not choices:
              raise SystemExit("Cloudflare returned no model choices")
          first=choices[0]
          answer=first.get("message",{}).get("content","")
          if first.get("finish_reason") != "stop" or not isinstance(answer,str) or not answer.strip():
              raise SystemExit("Cloudflare output was empty or truncated")
          print("CLOUDFLARE_WORKERS_FREE_LIVE_MODEL_VERIFIED=True")
          print("Cloudflare Gemma returned a complete live text response; no paid model selected.")
          PY

      - name: Verify actual free-only Cloudflare Qwen visual QA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, json, os, re, struct, urllib.request, urllib.error, zlib
          if os.environ.get("FREE_CONFIRMED") != "1":
              raise SystemExit("STOP: Workers Free is not confirmed.")
          account=os.environ.get("ACCOUNT","").strip()
          token=os.environ.get("TOKEN","").strip()
          if not re.fullmatch(r"[a-f0-9]{32}",account) or not re.fullmatch(r"[A-Za-z0-9_-]{25,250}",token):
              raise SystemExit("STOP: required Workers Free credentials missing or invalid.")
          # A 64x64 synthetic white PNG verifies the exact image path expected
          # by Kaurivo's independent visual QA. No external/customer photos.
          width=height=64
          def chunk(name,data):
              return (struct.pack(">I",len(data))+name+data+
                      struct.pack(">I",zlib.crc32(name+data)&0xffffffff))
          raw=b"".join(b"\x00"+b"\xff\xff\xff"*width for _ in range(height))
          png=(b"\x89PNG\r\n\x1a\n"+
              chunk(b"IHDR",struct.pack(">IIBBBBB",width,height,8,2,0,0,0))+
              chunk(b"IDAT",zlib.compress(raw))+chunk(b"IEND",b""))
          uri="data:image/png;base64,"+base64.b64encode(png).decode("ascii")
          model="@cf/qwen/qwen3.8-27b"
          payload={"model":model,"stream":False,"max_tokens":1024,
                   "messages":[
                      {"role":"system","content":"Briefly identify the dominant color of the provided test image."},
                      {"role":"user","content":[
                          {"type":"text","text":"What is the dominant color? One word."},
                          {"type":"image_url","image_url":{"url":uri}}
                      ]}
                   ]}
          req=urllib.request.Request(
              "https://api.cloudflare.com/client/v4/accounts/"+account+"/ai/v1/chat/completions",
              data=json.dumps(payload).encode(),method="POST",
              headers={"Authorization":"Bearer "+token,
                       "Content-Type":"application/json"})
          try:
              with urllib.request.urlopen(req,timeout=150) as res:
                  status=res.status
                  response=json.load(res)
          except urllib.error.HTTPError as exc:
              raise SystemExit("Cloudflare Free visual model HTTP "+str(exc.code)) from None
          except Exception as exc:
              raise SystemExit("Cloudflare Free visual QA request failed: "+
                               type(exc).__name__) from None
          choices=response.get("choices") if isinstance(response,dict) else None
          if status!=200 or not isinstance(choices,list) or not choices:
              raise SystemExit("Cloudflare Free visual QA response malformed")
          item=choices[0]
          content=item.get("message",{}).get("content","")
          if item.get("finish_reason")!="stop" or not isinstance(content,str) or not content.strip():
              raise SystemExit("Cloudflare Free visual QA response empty or incomplete")
          print("CLOUDFLARE_WORKERS_FREE_VISUAL_QA_VERIFIED=True")
          print("Qwen visual QA accepted a synthetic PNG with a complete response.")
          PY

      - name: Check realistic free Cloudflare Research JSON request
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, json, urllib.request, urllib.error
          if os.getenv("FREE_CONFIRMED") != "1":
              raise SystemExit("Free plan not confirmed")
          account=os.getenv("ACCOUNT","").strip()
          token=os.getenv("TOKEN","").strip()
          if not re.fullmatch(r"[a-f0-9]{32}",account) or not re.fullmatch(r"[A-Za-z0-9_-]{25,250}",token):
              raise SystemExit("Missing approved Workers Free credentials")
          # No customer details. Approximate factual extraction's length,
          # JSON output mode and maximum output budget. One request only.
          system="Extract only sourced facts into strict JSON. "+(
               "Preserve every heading, menu, service and brand color. "*85)
          user="Source pages (synthetic): "+(
               "Service: coffee, opening hours: unknown, brand color: teal. "*260)
          payload={"model":"@cf/google/gemma-4-26b-a4b-it","stream":False,
                   "max_tokens":3500,"response_format":{"type":"json_object"},
                   "messages":[{"role":"system","content":system},
                               {"role":"user","content":user}]}
          req=urllib.request.Request(
              "https://api.cloudflare.com/client/v4/accounts/"+account+"/ai/v1/chat/completions",
              data=json.dumps(payload).encode(),method="POST",
              headers={"Authorization":"Bearer "+token,"Content-Type":"application/json"})
          try:
              with urllib.request.urlopen(req,timeout=160) as result:
                  status=result.status
                  body=json.load(result)
          except urllib.error.HTTPError as exc:
              print("REALISTIC_RESEARCH_HTTP_STATUS="+str(exc.code))
              try:
                  err=json.loads(exc.read(2500).decode("utf-8"))
                  code=err.get("errors",[{}])[0].get("code")
                  if isinstance(code,int):
                      print("REALISTIC_RESEARCH_PROVIDER_ERROR_CODE="+str(code))
              except Exception:
                  pass
              raise SystemExit("Cloudflare Free rejected realistic research shape") from None
          except Exception as exc:
              raise SystemExit("Cloudflare Free research request transport error: "+type(exc).__name__) from None
          first=body.get("choices",[{}])[0]
          reason=first.get("finish_reason")
          msg=first.get("message",{})
          answer=msg.get("content") if isinstance(msg,dict) else None
          print("REALISTIC_RESEARCH_HTTP_STATUS="+str(status))
          print("REALISTIC_RESEARCH_FINISH_REASON="+str(reason)[:28])
          print("REALISTIC_RESEARCH_HAS_CONTENT="+str(bool(answer)))
          if not isinstance(answer,str) or not answer.strip() or reason!="stop":
              raise SystemExit("Cloudflare realistic JSON research was truncated or empty")
          try:
              json.loads(answer)
          except json.JSONDecodeError:
              raise SystemExit("Cloudflare realistic JSON research is malformed")
          print("REALISTIC_RESEARCH_JSON_VERIFIED=True")
          PY
