name: Oskar Haglund V7 exact public Pages smoke
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/oskar-haglund-v7-live-pages-smoke.yml"
      - "website-builder-agent/website-builder-agent/docs/kaurivo/owner-previews/oskar-haglund-v7/**"
  workflow_run:
    workflows: ["Deploy static content to Pages"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oskar-haglund-v7-live-pages-smoke
  cancel-in-progress: true
jobs:
  exact-live:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Verify real published HTTP response and client-side assets
        shell: bash
        run: |
          set -euo pipefail
          base="https://k4k33.github.io/website-builder-agent/kaurivo/owner-previews/oskar-haglund-v7/"
          for entry in \
            "|Ei yrityksen virallinen sivu" \
            "tjanster/|data-email-builder" \
            "kontakt/|info@oskarhaglund.fi" \
            "assets/site.css|.hero-art" \
            "assets/site.js|data-email-builder" \
            "assets/favicon.svg|Neutral demo favicon"; do
            path="${entry%%|*}"
            marker="${entry#*|}"
            url="${base}${path}"
            passed=false
            for attempt in 1 2 3 4 5 6 7 8; do
              code=$(curl -fsSL --max-time 20 -o /tmp/kaurivo-oskar-haglund-live -w '%{http_code}' "$url" || true)
              printf '%s attempt %s HTTP %s\n' "$path" "$attempt" "$code"
              if [[ "$code" == 200 ]] && grep -Fq -- "$marker" /tmp/kaurivo-oskar-haglund-live; then
                passed=true
                break
              fi
              sleep 6
            done
            if [[ "$passed" != true ]]; then
              echo "::error::Cannot verify released exact V7 owner preview: $url"
              exit 1
            fi
            echo "HTTP 200 and exact marker: $url" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "Verified complete published owner-only bilingual V7 design study, not client-ready or independently graded." >> "$GITHUB_STEP_SUMMARY"
