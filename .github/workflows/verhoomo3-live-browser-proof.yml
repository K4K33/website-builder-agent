name: Verhoomo 3 Assaa public browser smoke - internal preview only
on:
  push:
    branches: [preview/verhoomo-3-assaa-20261110]
  workflow_dispatch:

concurrency:
  group: verhoomo3-live-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  public-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website-builder-agent/website-builder-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Chromium for real HTTP/CSS/visual/mobile proof
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test exact deployed preview at 390, 768 and 1440 pixels
        env:
          KAURIVO_PREVIEW_URL: https://kaurivo-verhoomo-3assaa-2026.onrender.com
        run: python scripts/verify_verhoomo3_live_preview.py
      - name: Save screenshot and failure diagnostics even when tests fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verhoomo3-exact-public-browser-proof
          path: website-builder-agent/website-builder-agent/output/verhoomo3-live-smoke/
          if-no-files-found: warn
          retention-days: 30
