name: Kaurivo automatically published previews universal quality

on:
  push:
    branches: ["auto/kaurivo-demos"]
    paths:
      - "website-builder-agent/website-builder-agent/docs/kaurivo/auto-previews/**"
      - "website-builder-agent/website-builder-agent/data/demo_provenance/**"
      - ".github/workflows/kaurivo-auto-preview-universal-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-all-auto-previews:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Load latest universal rules from production main
        uses: actions/checkout@v4
        with:
          ref: main
          path: quality-rules
      - name: Load exact public auto-preview branch
        uses: actions/checkout@v4
        with:
          ref: auto/kaurivo-demos
          path: preview-branch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install offline HTML parser (no AI or paid search)
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Bring actual deployed pages and source evidence to audit workspace
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="preview-branch/website-builder-agent/website-builder-agent"
          TARGET="quality-rules/website-builder-agent/website-builder-agent"
          test -d "$SOURCE/docs/kaurivo/auto-previews"
          mkdir -p "$TARGET/docs/kaurivo/auto-previews" "$TARGET/data/demo_provenance"
          cp -a "$SOURCE/docs/kaurivo/auto-previews/." "$TARGET/docs/kaurivo/auto-previews/"
          if test -d "$SOURCE/data/demo_provenance"; then
            cp -a "$SOURCE/data/demo_provenance/." "$TARGET/data/demo_provenance/"
          fi
      - name: Verify ALL auto previews with original Master Prompt and real provenance
        working-directory: quality-rules/website-builder-agent/website-builder-agent
        env:
          KAURIVO_DEMO_QA_SCOPE: auto-previews
          KAURIVO_DEMO_QA_AUDIT_ALL: "1"
        shell: bash
        run: |
          set -euo pipefail
          if python scripts/audit_changed_demo_previews.py; then
            echo "### Objective auto-preview QA passed" >> "$GITHUB_STEP_SUMMARY"
            echo "This is NOT independent 9.5 visual approval or client release." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### QUALITY HOLD: preview does not meet the same universal contract as the builder" >> "$GITHUB_STEP_SUMMARY"
            echo "Public hosting and simple browser smoke tests do not override missing provenance, A/B/C concepts, original-brand continuity or source content parity." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
