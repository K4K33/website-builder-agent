name: Kaurivo new business first-pass dog salon QA

on:
  pull_request:
    paths:
      - "website-builder-agent/website-builder-agent/docs/kaurivo/demos/helsingin-koiratrimmaamo-v1/**"
      - "website-builder-agent/website-builder-agent/tests/test_kaurivo_koiratrimmaamo_first_pass.py"
      - "website-builder-agent/website-builder-agent/tests/kaurivo_koiratrimmaamo_screenshots.py"
      - ".github/workflows/kaurivo-new-business-first-pass-qa.yml"
  push:
    branches: [main]
    paths:
      - "website-builder-agent/website-builder-agent/docs/kaurivo/demos/helsingin-koiratrimmaamo-v1/**"
      - ".github/workflows/kaurivo-new-business-first-pass-qa.yml"

permissions:
  contents: read

jobs:
  authentic-content:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    defaults:
      run:
        working-directory: website-builder-agent/website-builder-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install beautifulsoup4
      - name: Complete original facts, service/pricing continuity, all pages and real links
        run: python -m unittest tests.test_kaurivo_koiratrimmaamo_first_pass.HtmlEvidence -v
  four-viewports:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    defaults:
      run:
        working-directory: website-builder-agent/website-builder-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install beautifulsoup4 playwright
      - run: python -m playwright install --with-deps chromium
      - name: Real browser 320, 390, 768, 1440, keyboard and mobile menu
        run: python -m unittest tests.test_kaurivo_koiratrimmaamo_first_pass.BrowserFirstPass -v
      - name: Independently inspect first-pass desktop/mobile render evidence
        run: python tests/kaurivo_koiratrimmaamo_screenshots.py
      - name: Archive actual first-pass screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaurivo-helsingin-koiratrimmaamo-first-pass-screenshots
          path: website-builder-agent/website-builder-agent/output/_koiratrimmaamo_qa_shots/*.jpg
          if-no-files-found: ignore
          retention-days: 14
