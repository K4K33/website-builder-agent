name: Builder quality tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website-builder-agent/website-builder-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Fast syntax check before expensive browser setup
        run: python -m compileall -q agents utils tests scripts main.py
      - name: Install browser without apt when base system already supports it
        run: |
          python -m playwright install chromium
          if ! python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(headless=True); b.close(); p.stop()'; then
            echo "Browser launch needs Linux runtime libraries; install them only now."
            python -m playwright install-deps chromium
            python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(headless=True); b.close(); p.stop()'
          fi
      - name: Full suite with automatic root-cause report (must be zero failures)
        run: python scripts/quality_diagnostics.py --json output/quality-diagnostics.json --markdown output/quality-diagnostics.md
        env:
          REQUIRE_BROWSER_TESTS: '1'
      - name: Keep evidence even if tests fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-diagnostics-${{ github.run_id }}
          path: |
            website-builder-agent/website-builder-agent/output/quality-diagnostics.json
            website-builder-agent/website-builder-agent/output/quality-diagnostics.md
          if-no-files-found: warn
          retention-days: 30
