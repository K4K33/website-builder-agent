name: Kaurivo Etikki live multi-page visual QA

on:
  workflow_run:
    workflows: ["Deploy static content to Pages"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  etikki-live:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website-builder-agent/website-builder-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Check Etikki 7 routes at 320/390/768/1440 and capture screenshots
        run: python -m tests.browser_etikki_demo --live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: etikki-v1-full-site-browser-screenshots
          path: website-builder-agent/website-builder-agent/qa-evidence/etikki-v1/
          if-no-files-found: ignore
