name: Settimedia owner-demo real browser QA
on:
  pull_request:
    paths:
      - ".github/workflows/settimedia-demo-review.yml"
      - "website-builder-agent/website-builder-agent/docs/kaurivo/owner-previews/settimedia-v8/**"
      - "website-builder-agent/website-builder-agent/scripts/settimedia_preview_smoke.py"
  push:
    branches: [main]
    paths:
      - "website-builder-agent/website-builder-agent/docs/kaurivo/owner-previews/settimedia-v8/**"
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website-builder-agent/website-builder-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Install Chromium without unsupported apt dependency fallback
        run: |
          python -m playwright install chromium
          if ! python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(headless=True); b.close(); p.stop()'; then
            python -m playwright install-deps chromium
            python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); b=p.chromium.launch(headless=True); b.close(); p.stop()'
          fi
      - name: Check real desktop/mobile layout, nav and images
        run: python scripts/settimedia_preview_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: settimedia-browser-review-${{ github.run_id }}
          path: website-builder-agent/website-builder-agent/output/settimedia-demo-smoke/
          retention-days: 14
