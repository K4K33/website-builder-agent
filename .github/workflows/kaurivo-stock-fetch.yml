name: Kaurivo stock fetch
# Fetches licensed stock illustrations for one trade topic (no company data) so a
# sales demo can be rendered elsewhere. Artifact kept 1 day only.
on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Trade words, e.g. kylpyhuoneremontti laatoitus"
        required: true
        type: string
      recipient:
        description: "Base64 PEM public key; photos are encrypted to it and printed, never stored in plain form"
        required: true
        type: string
      queries:
        description: "Optional English queries, comma separated (lowercase words)"
        required: false
        default: ""
        type: string
      count:
        description: "Photos (max 8)"
        required: false
        default: "6"
        type: string
      providers:
        description: "Optional provider order, e.g. openverse,pixabay (default: pexels,pixabay,openverse)"
        required: false
        default: ""
        type: string
      min_width:
        description: "Optional minimum photo width in px (e.g. 2400 for full-bleed heroes)"
        required: false
        default: ""
        type: string
      max_side:
        description: "Longest side of the delivered webp (default 1800, max 3000)"
        required: false
        default: "1800"
        type: string
      kind:
        description: "stock = licensed stock photos; sequence = AI build-stage sequence (Workers Free, ~720 neurons)"
        required: false
        default: "stock"
        type: string
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website-builder-agent/website-builder-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests pillow
      - name: Fetch
        if: inputs.kind != 'sequence'
        env:
          KAURIVO_PIXABAY_API_KEY: ${{ secrets.KAURIVO_PIXABAY_API_KEY }}
          KAURIVO_UNSPLASH_ACCESS_KEY: ${{ secrets.KAURIVO_UNSPLASH_ACCESS_KEY }}
          TOPIC: ${{ inputs.topic }}
          COUNT: ${{ inputs.count }}
          QUERIES: ${{ inputs.queries }}
          KAURIVO_STOCK_PROVIDERS: ${{ inputs.providers }}
          KAURIVO_STOCK_MIN_WIDTH: ${{ inputs.min_width }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from utils.stock_media import fetch_stock_photos
          n = max(1, min(8, int(os.environ.get("COUNT") or 6)))
          queries = [q.strip() for q in os.environ.get("QUERIES", "").split(",") if q.strip()][:6]
          got = fetch_stock_photos(os.environ["TOPIC"][:120], Path("stock-out"), count=n, queries=queries)
          print(len(got), [(g["provider"], g["licence"]) for g in got])
          if not got:
              raise SystemExit("no photos")
          PY
      - name: Generate illustrated build sequence (Workers Free)
        if: inputs.kind == 'sequence'
        env:
          KAURIVO_CLOUDFLARE_WORKERS_FREE_CONFIRMED: ${{ vars.KAURIVO_CLOUDFLARE_WORKERS_FREE_CONFIRMED || '0' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.KAURIVO_CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.KAURIVO_CLOUDFLARE_API_TOKEN }}
          KAURIVO_ILLUSTRATED_SEQUENCE: "1"
          KAURIVO_GEMINI_API_KEY: ${{ secrets.KAURIVO_GEMINI_API_KEY }}
          KAURIVO_GEMINI_FREE_CONFIRMED: ${{ vars.KAURIVO_GEMINI_FREE_CONFIRMED || '1' }}
          FREE_ONLY: "1"
          TOPIC: ${{ inputs.topic }}
        run: |
          python - <<'PY'
          import json, os, time
          from pathlib import Path
          from utils.illustrated_sequence import generate_sequence
          start = time.monotonic()
          got = generate_sequence(os.environ["TOPIC"][:120], Path("stock-out"))
          from utils import cloudflare_free_ai, illustrated_sequence
          print("sequence:", bool(got), "%.0fs" % (time.monotonic() - start),
                "workers_free:", cloudflare_free_ai.enabled(), "last:", illustrated_sequence.LAST_ERROR)
          if not got:
              raise SystemExit("no sequence")
          for p in got["paths"]:
              Path(p).rename(Path(p).with_suffix(".jpg"))
          Path("stock-out/credits.json").write_text(json.dumps(
              {"labels": got["labels"], "note": got["note"], "transitions": got["transitions"]}))
          PY
      - name: Encrypt for the recipient
        env:
          RECIPIENT: ${{ inputs.recipient }}
          MAX_SIDE: ${{ inputs.max_side }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from PIL import Image
          for p in Path("stock-out").glob("*.jpg"):
              side = max(800, min(3000, int(os.environ.get("MAX_SIDE") or 1800))); im = Image.open(p).convert("RGB"); im.thumbnail((side, side)); im.save(p.with_suffix(".webp"), "WEBP", quality=82); p.unlink()
          PY
          sed -i 's/\.jpg"/.webp"/g' stock-out/credits.json
          echo "$RECIPIENT" | base64 -d > /tmp/pub.pem
          tar -C stock-out -czf /tmp/s.tgz .
          openssl rand -hex 32 > /tmp/k
          openssl enc -aes-256-cbc -pbkdf2 -salt -in /tmp/s.tgz -out /tmp/s.enc -pass file:/tmp/k
          openssl pkeyutl -encrypt -pubin -inkey /tmp/pub.pem -pkeyopt rsa_padding_mode:oaep -in /tmp/k -out /tmp/k.enc
          echo "KEY:$(base64 -w0 /tmp/k.enc)"
          base64 -w 4000 /tmp/s.enc | sed 's/^/DAT:/'
          rm -f /tmp/k /tmp/s.tgz
